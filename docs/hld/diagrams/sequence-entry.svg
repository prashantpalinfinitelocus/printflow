stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='154' y='132' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST /api/campaign/moderate {text}   (cookie dc_token)</text><path d='M400 184 L630 184' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='404' y='176' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST /campaign/moderate  Authorization: Bearer</text><path d='M650 228 L880 228' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='654' y='220' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>participant lookup; token ver must equal participants.token_version</text><rect x='320' y='256' width='390' height='60' fill='#fff8d6' stroke='#d9c86a'/><text x='328' y='276' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>text rules (allowlist, &lt;=12 chars) then Gemini on Vertex AI.</text><text x='328' y='298' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>moderation down -&gt; 503 MODERATION_UNAVAILABLE (never approves)</text><path d='M630 346 L400 346' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='404' y='338' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>200 {result: APPROVED|REJECTED}</text><path d='M380 390 L150 390' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='154' y='382' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>200</text><path d='M140 434 L190 434 L190 458 L140 458' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='196' y='442' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>preview renders PNG in the browser (no entry yet)</text><path d='M150 486 L380 486' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='154' y='478' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST /api/campaign/entries {design_id,text,idempotency_key}</text><path d='M400 530 L630 530' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='404' y='522' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST /campaign/entries</text><path d='M650 574 L880 574' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='654' y='566' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>same key already stored? -&gt; 200 same entry_id</text><rect x='570' y='602' width='390' height='86' fill='#fff8d6' stroke='#d9c86a'/><text x='578' y='622' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>window state (server clock): not OPEN -&gt; 409 WINDOW_CLOSED</text><text x='578' y='644' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>entries &gt;= cap (50) -&gt; 409 ENTRY_LIMIT_REACHED</text><text x='578' y='666' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>re-validate + re-moderate text (fail-closed)</text><path d='M650 718 L880 718' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='654' y='710' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>INSERT campaign_entries (campaign_day in campaign tz)</text><path d='M630 762 L400 762' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='404' y='754' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>201 {entry_id}</text><path d='M380 806 L150 806' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='154' y='798' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>201 -&gt; navigate to /user-campaign/success</text></svg>