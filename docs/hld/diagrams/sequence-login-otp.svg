<svg xmlns='http://www.w3.org/2000/svg' width='1550' height='1020' viewBox='0 0 1550 1020'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#252b33'/></marker><marker id='ab' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4a78e0'/></marker><pattern id='g' width='24' height='24' patternUnits='userSpaceOnUse'><path d='M24 0H0V24' fill='none' stroke='#eef0f3'/></pattern></defs><rect width='1550' height='1020' fill='#fff'/><rect width='1550' height='1020' fill='url(#g)'/><text x='30' y='40' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='700' fill='#252b33'>Sequence: login with phone OTP and email (Infobip flag OFF = bypass; ON = real SMS)</text><rect x='65' y='64' width='150' height='38' rx='6' fill='#4a78e0'/><text x='140' y='88' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#fff'>Browser</text><path d='M140 102V990' stroke='#9aa3ad' stroke-dasharray='5 5'/><rect x='315' y='64' width='150' height='38' rx='6' fill='#4a78e0'/><text x='390' y='88' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#fff'>Web (Next.js)</text><path d='M390 102V990' stroke='#9aa3ad' stroke-dasharray='5 5'/><rect x='565' y='64' width='150' height='38' rx='6' fill='#4a78e0'/><text x='640' y='88' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#fff'>API (FastAPI)</text><path d='M640 102V990' stroke='#9aa3ad' stroke-dasharray='5 5'/><rect x='815' y='64' width='150' height='38' rx='6' fill='#4a78e0'/><text x='890' y='88' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#fff'>Postgres</text><path d='M890 102V990' stroke='#9aa3ad' stroke-dasharray='5 5'/><rect x='1065' y='64' width='150' height='38' rx='6' fill='#4a78e0'/><text x='1140' y='88' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#fff'>Infobip SMS</text><path d='M1140 102V990' stroke='#9aa3ad' stroke-dasharray='5 5'/><path d='M150 140 L380 140' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='154' y='132' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST /offline-store/api/campaign/otp/send {phone,email}</text><path d='M400 184 L630 184' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='404' y='176' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST /campaign/otp/send</text><path d='M650 228 L880 228' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='654' y='220' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>lock guard row (FOR UPDATE); count sends in window</text><rect x='570' y='256' width='390' height='60' fill='#fff8d6' stroke='#d9c86a'/><text x='578' y='276' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>send #1-5 in 300 s: allowed.  send #6: set blocked_until = now+7200 s,</text><text x='578' y='298' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>answer 429 OTP_BLOCKED {retry_after:7200} + Retry-After header</text><path d='M650 346 L880 346' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='654' y='338' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>expire live OTP; INSERT campaign_otps (HMAC hash; NULL when bypass)</text><path d='M650 390 L1130 390' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='654' y='382' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>flag ON only: POST /sms/3/messages (DLT template)</text><path d='M1130 434 L650 434' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='654' y='426' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>202/200 (4xx -&gt; 503 OTP_SEND_FAILED)</text><path d='M630 478 L400 478' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='404' y='470' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>200 {resend_after:30}</text><path d='M380 522 L150 522' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='154' y='514' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>200</text><path d='M150 566 L380 566' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='154' y='558' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST .../otp/verify {phone,email,code}</text><path d='M400 610 L630 610' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='404' y='602' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>POST /campaign/otp/verify</text><path d='M650 654 L880 654' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='654' y='646' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>lock guard; blocked? -&gt; 429.  bypass code or hash compare</text><rect x='570' y='682' width='390' height='60' fill='#fff8d6' stroke='#d9c86a'/><text x='578' y='702' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>wrong code: failed_verifies+1; 5th -&gt; 429 OTP_LOCKED for 7200 s</text><text x='578' y='724' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#252b33'>right code: mark consumed, reset failures, upsert participant</text><path d='M640 772 L690 772 L690 796 L640 796' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='696' y='780' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>mint JWT (aud, iss, jti, ver, iat, exp)</text><path d='M630 824 L400 824' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='404' y='816' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>200 {token, expires_in, phone, email}</text><path d='M380 868 L150 868' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='154' y='860' text-anchor='start' font-family='Menlo, Courier, monospace' font-size='12.5' font-weight='400' fill='#252b33'>Set-Cookie dc_token (httpOnly, SameSite=Lax); body without token</text></svg>