7fb' stroke='#4a78e0' stroke-width='2'/><text x='835.0' y='121.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>Design + text</text><text x='835.0' y='139.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>/create</text><rect x='1000' y='90' width='150' height='70' rx='10' fill='#dfe7fb' stroke='#4a78e0' stroke-width='2'/><text x='1075.0' y='121.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>Moderation</text><text x='1075.0' y='139.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>(server)</text><rect x='1240' y='90' width='150' height='70' rx='10' fill='#dfe7fb' stroke='#4a78e0' stroke-width='2'/><text x='1315.0' y='121.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>Preview</text><text x='1315.0' y='139.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>download/share</text><rect x='1480' y='90' width='150' height='70' rx='10' fill='#dfe7fb' stroke='#4a78e0' stroke-width='2'/><text x='1555.0' y='121.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>Submit entry</text><text x='1555.0' y='139.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>(server window)</text><rect x='1720' y='90' width='150' height='70' rx='10' fill='#dfe7fb' stroke='#4a78e0' stroke-width='2'/><text x='1795.0' y='121.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>Thank-you</text><text x='1795.0' y='139.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33