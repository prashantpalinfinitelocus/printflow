a, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>store HMAC hash</text><rect x='1320' y='460' width='210' height='70' rx='10' fill='#dfe7fb' stroke='#4a78e0' stroke-width='2'/><text x='1425.0' y='500.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>Infobip flag ON ?</text><rect x='1630' y='400' width='230' height='70' rx='10' fill='#e3f4e6' stroke='#4a78e0' stroke-width='2'/><text x='1745.0' y='440.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>send DLT SMS</text><rect x='1630' y='520' width='230' height='70' rx='10' fill='#fff8d6' stroke='#4a78e0' stroke-width='2'/><text x='1745.0' y='560.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>bypass: no SMS</text><rect x='320' y='640' width='240' height='70' rx='10' fill='#fde8e6' stroke='#4a78e0' stroke-width='2'/><text x='440.0' y='671.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>429 OTP_BLOCKED</text><text x='440.0' y='689.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>retry_after = remaining</text><rect x='660' y='640' width='240' height='70' rx='10' fill='#fde8e6' stroke='#4a78e0' stroke-width='2'/><text x='780.0' y='671.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>set blocked_until</text><text x='780.0' y='689.0' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='600' fill='#252b33'>= now + 7200 s -&gt; 429</text><path d='M240 495 L320 495' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><path d='M560 495 L660 495' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='610' y='485' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#252b33'>no</text><path d='M900 495 L1000 495' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='950' y='485' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#252b33'>no</text><path d='M1220 495 L1320 495' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><path d='M1530 480 L1630 440' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='1580' y='450' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#252b33'>yes</text><path d='M1530 510 L1630 550' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='1580' y='545' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#252b33'>no</text><path d='M440 530 L440 640' fill='none' stroke='#d93025' stroke-width='2.2' marker-end='url(#a)'/><text x='462' y='590' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#d93025'>yes</text><path d='M780 530 L780 640' fill='none' stroke='#d93025' stroke-width='2.2' marker-end='url(#a)'/><text x='802' y='590' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#d93025'>yes</text><text x='40' y='770' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#252b33'>Limits are settings: send limit 5, window 300 s, block 7200 s, verify failures 5, verify lock 7200 s, code TTL 300 s.</text><text x='40' y='795' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#252b33'>State is in Postgres (campaign_otps, campaign_phone_guards), so the limits hold across Cloud Run instances and concurrent requests.</text></svg>