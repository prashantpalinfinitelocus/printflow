<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='760' viewBox='0 0 1500 760'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#252b33'/></marker><marker id='ab' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#4a78e0'/></marker><pattern id='g' width='24' height='24' patternUnits='userSpaceOnUse'><path d='M24 0H0V24' fill='none' stroke='#eef0f3'/></pattern></defs><rect width='1500' height='760' fill='#fff'/><rect width='1500' height='760' fill='url(#g)'/><text x='30' y='40' text-anchor='start' font-family='Helvetica, Arial, sans-serif' font-size='22' font-weight='700' fill='#252b33'>Database: campaign tables (PostgreSQL 16, created by create_all + additive migrations)</text><rect x='40' y='80' width='380' height='230' rx='6' fill='#fff' stroke='#9aa3ad'/><rect x='40' y='80' width='380' height='30' rx='6' fill='#e8eaed' stroke='#9aa3ad'/><text x='50' y='100' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#252b33'>campaign_participants</text><text x='50' y='130' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>id             int PK</text><text x='50' y='149' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>phone          varchar(16) UNIQUE</text><text x='50' y='168' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>email          varchar(255)</text><text x='50' y='187' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>token_version  int default 0</text><text x='50' y='206' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>created_at     timestamptz</text><text x='50' y='225' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'></text><text x='50' y='244' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>one row per phone; latest email wins</text><rect x='520' y='80' width='420' height='250' rx='6' fill='#fff' stroke='#9aa3ad'/><rect x='520' y='80' width='420' height='30' rx='6' fill='#e8eaed' stroke='#9aa3ad'/><text x='530' y='100' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#252b33'>campaign_entries</text><text x='530' y='130' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>id               varchar(36) PK (uuid)</text><text x='530' y='149' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>participant_id   FK -&gt; participants.id</text><text x='530' y='168' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>idempotency_key  varchar(64)</text><text x='530' y='187' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>design_id        varchar(64)</text><text x='530' y='206' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>text             varchar(64)</text><text x='530' y='225' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>campaign_day     date (campaign tz)</text><text x='530' y='244' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>created_at       timestamptz</text><text x='530' y='263' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>UNIQUE(participant_id, idempotency_key)</text><rect x='40' y='400' width='420' height='210' rx='6' fill='#fff' stroke='#9aa3ad'/><rect x='40' y='400' width='420' height='30' rx='6' fill='#e8eaed' stroke='#9aa3ad'/><text x='50' y='420' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#252b33'>campaign_otps  (send log + code)</text><text x='50' y='450' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>id          int PK</text><text x='50' y='469' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>phone       varchar(16) idx</text><text x='50' y='488' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>code_hash   varchar(64) NULL (HMAC-SHA256)</text><text x='50' y='507' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>expires_at  timestamptz</text><text x='50' y='526' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>consumed_at timestamptz NULL</text><text x='50' y='545' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>created_at  timestamptz idx</text><text x='50' y='564' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>NULL hash = bypass send</text><rect x='560' y='400' width='420' height='170' rx='6' fill='#fff' stroke='#9aa3ad'/><rect x='560' y='400' width='420' height='30' rx='6' fill='#e8eaed' stroke='#9aa3ad'/><text x='570' y='420' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#252b33'>campaign_phone_guards</text><text x='570' y='450' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>phone            varchar(16) PK</text><text x='570' y='469' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>blocked_until    timestamptz NULL</text><text x='570' y='488' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>block_reason     varchar(32) NULL</text><text x='570' y='507' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>failed_verifies  int default 0</text><text x='570' y='526' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>row lock serialises per phone</text><path d='M420 160 L520 160' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)'/><text x='470' y='150' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#252b33'>1 : N</text><path d='M460 480 L560 480' fill='none' stroke='#252b33' stroke-width='2.2' marker-end='url(#a)' stroke-dasharray="7 5"/><text x='510' y='470' text-anchor='middle' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#252b33'>by phone</text><rect x='1040' y='80' width='420' height='250' rx='6' fill='#fff' stroke='#9aa3ad'/><rect x='1040' y='80' width='420' height='30' rx='6' fill='#dfe7fb' stroke='#9aa3ad'/><text x='1050' y='100' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='700' fill='#252b33'>Existing PrintFlow tables (unchanged)</text><text x='1050' y='130' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>users, stores, print_formats</text><text x='1050' y='149' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>orders, csv_batches, print_jobs</text><text x='1050' y='168' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>app_settings</text><text x='1050' y='187' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'></text><text x='1050' y='206' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>Cloud Storage (/data):</text><text x='1050' y='225' font-family='Menlo, Courier, monospace' font-size='12.5' fill='#30343a'>psd/ fonts/ inbox/ output/</text></svg>